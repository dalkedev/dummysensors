name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[config,dev]'
      - name: Verify the release version and source branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -c 'import importlib.metadata, os; version = importlib.metadata.version("dummysensors"); assert os.environ["RELEASE_TAG"] == f"v{version}", f"Release tag must equal v{version}"'
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - name: Validate and build distributions
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          python -m build
          python -m twine check --strict dist/*
      - name: Store validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated distributions to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/dummysensors
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
