name: Ruff autofix

# Manual only: the previous weekly schedule created 61 orphaned branches.
# Repository Settings > Actions > General must allow Actions to create pull requests.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ruff-autofix
  cancel-in-progress: false

jobs:
  ruff-autofix:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the same tools as CI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[config,dev]'
      - name: Apply safe lint fixes and formatting
        run: |
          python -m ruff check --fix .
          python -m ruff format .
      - name: Validate fixes before creating a branch
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Create or update the single autofix pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: chore/ruff-autofix
          title: "style: apply Ruff fixes"
          commit-message: "style: apply Ruff fixes"
          body: |
            Apply safe Ruff fixes and formatting with the project's development dependencies.

            Validation: Ruff lint, Ruff formatting, and the full pytest suite passed.
            GitHub's default GITHUB_TOKEN does not trigger CI for this pull request;
            these checks ran before its branch was created or updated.
          add-paths: |
            src/
            tests/
          delete-branch: true
